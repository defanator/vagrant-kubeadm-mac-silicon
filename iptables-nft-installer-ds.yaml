apiVersion: apps/v1

kind: DaemonSet

metadata:
  labels:
    k8s-app: iptables-nft-installer
  name: iptables-nft-installer
  namespace: kube-system

spec:
  selector:
    matchLabels:
      k8s-app: iptables-nft-installer
  template:
    metadata:
      labels:
        k8s-app: iptables-nft-installer
    spec:
      priorityClassName: system-node-critical
      hostPID: true
      restartPolicy: Always
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      initContainers:
      - name: package-installer
        image: amazonlinux:2
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -ex
            echo "Installing iptables-nft on $(cat /host/etc/hostname)"
            chroot /host yum install -y iptables-nft
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      containers:
      - image: registry.k8s.io/pause:3.5
        name: pause
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000
          readOnlyRootFilesystem: true
